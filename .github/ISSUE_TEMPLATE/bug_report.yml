name: 问题反馈
description: 安装、界面或数据问题
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: APK 版本
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 手机型号与 Android 版本
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤、预期与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图及比赛信息
      description: 数据问题补充比赛日期、双方、时区和获取时间。遮挡个人信息，不提交密钥、Cookie 或本地缓存。
